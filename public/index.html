<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nederlandse Nieuwsticker</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-scroll {
      animation: scroll 40s linear infinite;
    }
  </style>
  <script>
    // Opruimen: een vorige versie draaide als PWA (Woo Quest) op de root en kon
    // via een service worker een verouderde/kapotte pagina blijven serveren —
    // wat zich uit als een wit of eindeloos ladend scherm. Verwijder eenmalig
    // alle achtergebleven service workers + caches en herlaad één keer.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            return (self.caches && caches.keys) ? caches.keys() : [];
          })
          .then(function (keys) {
            return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
          })
          .then(function () {
            if (!sessionStorage.getItem('sw-cleaned')) {
              sessionStorage.setItem('sw-cleaned', '1');
              location.reload();
            }
          })
          .catch(function () {});
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- Zichtbare fallback als de CDN-scripts (React/Babel/Tailwind) niet laden,
       zodat je nooit een leeg wit scherm krijgt. Wordt verwijderd zodra de app rendert. -->
  <div id="fallback" style="display:none;font-family:sans-serif;padding:24px;color:#111;line-height:1.5">
    <h1 style="font-size:20px;margin:0 0 8px">Nieuwsticker kon niet laden</h1>
    <p style="margin:0 0 12px">De pagina kon de benodigde onderdelen niet ophalen. Controleer je internetverbinding en probeer het opnieuw.</p>
    <button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-size:15px">Opnieuw proberen</button>
  </div>
  <script>
    // Als React na 8s niets in #root heeft gerenderd, tonen we de fallback i.p.v.
    // een leeg scherm (bijv. wanneer een CDN geblokkeerd is).
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.childElementCount === 0) {
        var fb = document.getElementById('fallback');
        if (fb) fb.style.display = 'block';
      }
    }, 8000);
  </script>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    const NewsTicker = () => {
      const [articles, setArticles] = useState([]);
      const [loading, setLoading] = useState(true);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [error, setError] = useState(null);

      const fetchNews = async () => {
        // Time-out zodat de pagina nooit eindeloos op "Nieuws laden..." blijft hangen
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 12000);
        try {
          const response = await fetch('/api/news', { signal: controller.signal });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const data = await response.json();
          if (!Array.isArray(data)) throw new Error('Onverwacht antwoord');
          setArticles(data);
          setError(null);
        } catch (err) {
          setError(err.name === 'AbortError'
            ? 'Het laden duurde te lang'
            : 'Fout bij laden nieuws');
        } finally {
          clearTimeout(timer);
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchNews();
        const interval = setInterval(fetchNews, 300000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (articles.length === 0) return;
        const interval = setInterval(() => {
          setCurrentIndex((prev) => (prev + 1) % articles.length);
        }, 5000);
        return () => clearInterval(interval);
      }, [articles.length]);

      const formatTime = (dateStr) => {
        const date = new Date(dateStr);
        const now = new Date();
        const diff = Math.floor((now - date) / 1000);
        
        if (diff < 60) return 'Zojuist';
        if (diff < 3600) return `${Math.floor(diff / 60)} min geleden`;
        if (diff < 86400) return `${Math.floor(diff / 3600)} uur geleden`;
        return date.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      };

      if (loading) {
        return (
          <div className="flex items-center justify-center h-screen bg-gray-900 text-white">
            <div className="text-xl">Nieuws laden...</div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="flex flex-col items-center justify-center h-screen bg-gray-900 text-white gap-4 px-6 text-center">
            <div className="text-xl text-red-400">{error}</div>
            <button
              onClick={() => { setLoading(true); setError(null); fetchNews(); }}
              className="px-5 py-2 rounded-lg bg-blue-700 hover:bg-blue-600 text-white"
            >
              Opnieuw proberen
            </button>
          </div>
        );
      }

      const currentArticle = articles[currentIndex];

      return (
        <div className="min-h-screen bg-gray-900 text-white">
          <div className="bg-gradient-to-r from-blue-900 to-blue-700 p-4 shadow-lg">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
                </svg>
                <h1 className="text-2xl font-bold">Nederlandse Nieuwsticker</h1>
              </div>
              <div className="text-sm">
                {new Date().toLocaleTimeString('nl-NL')}
              </div>
            </div>
          </div>

          <div className="bg-red-600 text-white py-2 overflow-hidden">
            <div className="flex animate-scroll">
              <div className="flex whitespace-nowrap">
                <span className="text-sm font-semibold mx-4">● BREAKING NEWS</span>
                {articles.slice(0, 8).map((article, idx) => (
                  <span key={idx} className="mx-8 text-sm">
                    <span className="font-bold">{article.source}:</span> {article.title}
                  </span>
                ))}
              </div>
              <div className="flex whitespace-nowrap">
                <span className="text-sm font-semibold mx-4">● BREAKING NEWS</span>
                {articles.slice(0, 8).map((article, idx) => (
                  <span key={`dup-${idx}`} className="mx-8 text-sm">
                    <span className="font-bold">{article.source}:</span> {article.title}
                  </span>
                ))}
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto p-6">
            {currentArticle && (
              <div 
                className="bg-gray-800 rounded-lg p-6 mb-6 shadow-xl border-l-4 transition-all duration-500"
                style={{ borderColor: currentArticle.color }}
              >
                <div className="flex items-center gap-2 mb-3">
                  <span 
                    className="px-3 py-1 rounded-full text-xs font-bold text-white"
                    style={{ backgroundColor: currentArticle.color }}
                  >
                    {currentArticle.source}
                  </span>
                  <span className="text-gray-400 text-sm">
                    {formatTime(currentArticle.pubDate)}
                  </span>
                </div>
                <h2 className="text-3xl font-bold mb-4">{currentArticle.title}</h2>
                <a 
                  href={currentArticle.link} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="text-blue-400 hover:text-blue-300"
                >
                  Lees meer →
                </a>
              </div>
            )}

            <div className="grid gap-4">
              <h3 className="text-xl font-bold mb-2">
                Alle Berichten ({articles.length})
              </h3>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {articles.map((article, idx) => (
                  <div 
                    key={idx}
                    className="bg-gray-800 rounded-lg p-4 hover:bg-gray-750 transition-colors border-l-2"
                    style={{ borderColor: article.color }}
                  >
                    <div className="flex items-center gap-2 mb-2">
                      <span 
                        className="px-2 py-1 rounded text-xs font-bold text-white"
                        style={{ backgroundColor: article.color }}
                      >
                        {article.source}
                      </span>
                      <span className="text-gray-400 text-xs">
                        {formatTime(article.pubDate)}
                      </span>
                    </div>
                    <a 
                      href={article.link}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-white hover:text-blue-400"
                    >
                      <h4 className="font-semibold">{article.title}</h4>
                    </a>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<NewsTicker />, document.getElementById('root'));
  </script>
</body>
</html>
