<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nederlandse Nieuwsticker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111827;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; flex-direction: column; gap: 16px; }
    .muted { color: #9ca3af; }
    .btn { padding: 10px 18px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff; font-size: 15px; cursor: pointer; }
    .btn:hover { background: #2563eb; }

    .topbar { background: linear-gradient(to right, #1e3a8a, #1d4ed8); padding: 16px; box-shadow: 0 4px 6px rgba(0,0,0,.3); }
    .topbar-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .topbar h1 { font-size: 22px; font-weight: 700; }
    .clock { font-size: 13px; opacity: .9; }

    .ticker { background: #dc2626; color: #fff; padding: 8px 0; overflow: hidden; white-space: nowrap; }
    .ticker-track { display: inline-flex; animation: scroll 40s linear infinite; }
    .ticker-group { display: inline-flex; white-space: nowrap; }
    .ticker-label { font-size: 13px; font-weight: 600; margin: 0 16px; }
    .ticker-item { margin: 0 32px; font-size: 13px; }
    .ticker-item b { font-weight: 700; }
    @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .container { max-width: 1120px; margin: 0 auto; padding: 24px 16px; }
    .featured { background: #1f2937; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 20px rgba(0,0,0,.3); border-left: 4px solid #888; }
    .featured h2 { font-size: 26px; font-weight: 700; margin: 12px 0 16px; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
    .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .link { color: #60a5fa; }
    .link:hover { color: #93c5fd; }

    .section-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
    .card { background: #1f2937; border-radius: 10px; padding: 16px; border-left: 2px solid #888; }
    .card:hover { background: #243041; }
    .card h4 { font-weight: 600; font-size: 15px; }
    .badge-sm { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; }
    .meta-sm { color: #9ca3af; font-size: 11px; }
  </style>
  <script>
    // Opruimen: een vorige versie draaide als PWA (Woo Quest) op de root en kon
    // via een service worker een verouderde/kapotte pagina blijven serveren.
    // Verwijder eenmalig alle achtergebleven service workers + caches.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { return (self.caches && caches.keys) ? caches.keys() : []; })
          .then(function (keys) { return Promise.all((keys || []).map(function (k) { return caches.delete(k); })); })
          .then(function () {
            if (!sessionStorage.getItem('sw-cleaned')) {
              sessionStorage.setItem('sw-cleaned', '1');
              location.reload();
            }
          })
          .catch(function () {});
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <div id="root">
    <div class="center"><div style="font-size:20px">Nieuws laden...</div></div>
  </div>

  <script>
    (function () {
      var root = document.getElementById('root');
      var articles = [];
      var currentIndex = 0;
      var rotateTimer = null;
      var clockTimer = null;

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = (s == null ? '' : String(s));
        return d.innerHTML;
      }

      function formatTime(dateStr) {
        var date = new Date(dateStr);
        var diff = Math.floor((Date.now() - date.getTime()) / 1000);
        if (isNaN(diff)) return '';
        if (diff < 60) return 'Zojuist';
        if (diff < 3600) return Math.floor(diff / 60) + ' min geleden';
        if (diff < 86400) return Math.floor(diff / 3600) + ' uur geleden';
        return date.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      }

      function showLoading() {
        root.innerHTML = '<div class="center"><div style="font-size:20px">Nieuws laden...</div></div>';
      }

      function showError(msg) {
        root.innerHTML =
          '<div class="center">' +
            '<div style="font-size:20px;color:#f87171">' + esc(msg) + '</div>' +
            '<button class="btn" id="retry">Opnieuw proberen</button>' +
          '</div>';
        var b = document.getElementById('retry');
        if (b) b.addEventListener('click', load);
      }

      function tickerItem(a) {
        return '<span class="ticker-item"><b>' + esc(a.source) + ':</b> ' + esc(a.title) + '</span>';
      }

      function featuredHTML(a) {
        if (!a) return '';
        var color = esc(a.color || '#888');
        return '' +
          '<div class="meta">' +
            '<span class="badge" style="background:' + color + '">' + esc(a.source) + '</span>' +
            '<span class="muted" style="font-size:13px">' + esc(formatTime(a.pubDate)) + '</span>' +
          '</div>' +
          '<h2>' + esc(a.title) + '</h2>' +
          '<a class="link" href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer">Lees meer &rarr;</a>';
      }

      function render() {
        var top = articles.slice(0, 8);
        var tickerGroup = '<span class="ticker-group"><span class="ticker-label">&#9679; BREAKING NEWS</span>' +
          top.map(tickerItem).join('') + '</span>';

        var cards = articles.map(function (a) {
          var color = esc(a.color || '#888');
          return '' +
            '<div class="card" style="border-left-color:' + color + '">' +
              '<div class="meta">' +
                '<span class="badge-sm" style="background:' + color + '">' + esc(a.source) + '</span>' +
                '<span class="meta-sm">' + esc(formatTime(a.pubDate)) + '</span>' +
              '</div>' +
              '<a href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer"><h4>' + esc(a.title) + '</h4></a>' +
            '</div>';
        }).join('');

        var firstColor = esc((articles[0] && articles[0].color) || '#888');

        root.innerHTML = '' +
          '<div class="topbar"><div class="topbar-inner">' +
            '<h1>Nederlandse Nieuwsticker</h1>' +
            '<div class="clock" id="clock"></div>' +
          '</div></div>' +
          '<div class="ticker"><div class="ticker-track">' + tickerGroup + tickerGroup + '</div></div>' +
          '<div class="container">' +
            '<div class="featured" id="featured" style="border-left-color:' + firstColor + '">' +
              featuredHTML(articles[0]) +
            '</div>' +
            '<h3 class="section-title">Alle Berichten (' + articles.length + ')</h3>' +
            '<div class="grid">' + cards + '</div>' +
          '</div>';

        startClock();
        startRotation();
      }

      function startClock() {
        if (clockTimer) clearInterval(clockTimer);
        var update = function () {
          var c = document.getElementById('clock');
          if (c) c.textContent = new Date().toLocaleTimeString('nl-NL');
        };
        update();
        clockTimer = setInterval(update, 1000);
      }

      function startRotation() {
        if (rotateTimer) clearInterval(rotateTimer);
        if (articles.length === 0) return;
        rotateTimer = setInterval(function () {
          currentIndex = (currentIndex + 1) % articles.length;
          var f = document.getElementById('featured');
          if (f) {
            var a = articles[currentIndex];
            f.style.borderLeftColor = (a && a.color) || '#888';
            f.innerHTML = featuredHTML(a);
          }
        }, 5000);
      }

      function load() {
        showLoading();
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 12000);
        fetch('/api/news', { signal: controller.signal })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            if (!Array.isArray(data)) throw new Error('Onverwacht antwoord');
            articles = data;
            currentIndex = 0;
            if (articles.length === 0) {
              showError('Geen nieuws beschikbaar op dit moment');
            } else {
              render();
            }
          })
          .catch(function (err) {
            showError(err && err.name === 'AbortError' ? 'Het laden duurde te lang' : 'Fout bij laden nieuws');
          })
          .then(function () { clearTimeout(timer); });
      }

      // Ververs elke 5 minuten
      setInterval(function () {
        if (document.getElementById('featured')) load();
      }, 300000);

      load();
    })();
  </script>
</body>
</html>
