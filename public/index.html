<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nederlandse Nieuwsticker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --serif: Georgia, "Times New Roman", Times, serif;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --ink: #121212;
      --grey: #363636;
      --light: #666;
      --hair: #dcdcdc;
    }
    body {
      background: #fff;
      color: var(--ink);
      font-family: var(--serif);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .sans { font-family: var(--sans); }

    .center { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; flex-direction: column; gap: 16px; font-family: var(--sans); }
    .btn { font-family: var(--sans); padding: 10px 18px; border: 1px solid var(--ink); border-radius: 0; background: var(--ink); color: #fff; font-size: 14px; cursor: pointer; }
    .btn:hover { background: #fff; color: var(--ink); }

    /* Masthead */
    .masthead { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    .dateline { font-family: var(--sans); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--light);
      display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hair); }
    .nameplate { text-align: center; padding: 14px 0 12px; border-bottom: 2px solid var(--ink); }
    .nameplate h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(30px, 7vw, 52px); letter-spacing: -.5px; line-height: 1; }
    .nameplate .tag { font-family: var(--sans); text-transform: uppercase; letter-spacing: .22em; font-size: 10px; color: var(--light); margin-top: 8px; }

    /* Ticker — ingetogen zwarte balk */
    .ticker { background: var(--ink); color: #fff; overflow: hidden; white-space: nowrap; padding: 8px 0; }
    .ticker-track { display: inline-flex; animation: scroll 80s linear infinite; }
    .ticker-group { display: inline-flex; white-space: nowrap; align-items: center; }
    .ticker-label { font-family: var(--sans); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; margin: 0 18px; color: #f4c33b; }
    .ticker-item { font-family: var(--sans); margin: 0 22px; font-size: 13px; }
    .ticker-item b { font-weight: 700; }
    @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .container { max-width: 1100px; margin: 0 auto; padding: 28px 16px 48px; }
    .kicker { font-family: var(--sans); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .time { font-family: var(--sans); font-size: 12px; color: var(--light); }

    /* Lead-verhaal */
    .lead { padding-bottom: 28px; margin-bottom: 8px; border-bottom: 1px solid var(--hair); }
    .lead h2 { font-family: var(--serif); font-weight: 700; font-size: clamp(26px, 5vw, 38px); line-height: 1.08; margin-bottom: 14px; letter-spacing: -.3px; }
    .lead .summary { font-family: var(--serif); font-size: 18px; line-height: 1.55; color: var(--grey); margin-bottom: 14px; }
    .lead .more { font-family: var(--sans); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--ink); padding-bottom: 1px; }

    /* Sectiekop */
    .section-head { font-family: var(--sans); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      border-top: 1px solid var(--ink); padding-top: 8px; margin: 32px 0 4px; }

    /* Berichtenraster */
    .grid { display: grid; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; column-gap: 28px; } }
    @media (min-width: 960px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
    .card { padding: 18px 0; border-top: 1px solid var(--hair); }
    .card h4 { font-family: var(--serif); font-weight: 700; font-size: 18px; line-height: 1.2; margin-bottom: 6px; }
    .card .summary { font-family: var(--serif); font-size: 14px; line-height: 1.45; color: var(--grey); margin-bottom: 8px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
  <script>
    // Opruimen: een vorige versie draaide als PWA (Woo Quest) op de root en kon
    // via een service worker een verouderde/kapotte pagina blijven serveren.
    // Verwijder eenmalig alle achtergebleven service workers + caches.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () { return (self.caches && caches.keys) ? caches.keys() : []; })
          .then(function (keys) { return Promise.all((keys || []).map(function (k) { return caches.delete(k); })); })
          .then(function () {
            if (!sessionStorage.getItem('sw-cleaned')) {
              sessionStorage.setItem('sw-cleaned', '1');
              location.reload();
            }
          })
          .catch(function () {});
      }).catch(function () {});
    })();
  </script>
</head>
<body>
  <div id="root">
    <div class="center"><div style="font-size:18px">Nieuws laden…</div></div>
  </div>

  <script>
    (function () {
      var root = document.getElementById('root');
      var articles = [];
      var lastSig = '';

      function esc(s) {
        var d = document.createElement('div');
        d.textContent = (s == null ? '' : String(s));
        return d.innerHTML;
      }

      function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

      function formatTime(dateStr) {
        var date = new Date(dateStr);
        var diff = Math.floor((Date.now() - date.getTime()) / 1000);
        if (isNaN(diff)) return '';
        if (diff < 60) return 'Zojuist';
        if (diff < 3600) return Math.floor(diff / 60) + ' min geleden';
        if (diff < 86400) return Math.floor(diff / 3600) + ' uur geleden';
        return date.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      }

      function longDate() {
        return capitalize(new Date().toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
      }

      function showLoading() {
        root.innerHTML = '<div class="center"><div style="font-size:18px">Nieuws laden…</div></div>';
      }

      function showError(msg) {
        root.innerHTML =
          '<div class="center">' +
            '<div style="font-size:18px">' + esc(msg) + '</div>' +
            '<button class="btn" id="retry">Opnieuw proberen</button>' +
          '</div>';
        var b = document.getElementById('retry');
        if (b) b.addEventListener('click', load);
      }

      function tickerItem(a) {
        return '<span class="ticker-item"><b>' + esc(a.source) + '</b> &nbsp;' + esc(a.title) + '</span>';
      }

      function leadHTML(a) {
        if (!a) return '';
        var color = esc(a.color || '#121212');
        return '' +
          '<div class="kicker" style="color:' + color + '">' + esc(a.source) + '</div>' +
          '<a href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer"><h2>' + esc(a.title) + '</h2></a>' +
          (a.summary ? '<p class="summary">' + esc(a.summary) + '</p>' : '') +
          '<span class="time">' + esc(formatTime(a.pubDate)) + '</span>&nbsp;&nbsp;' +
          '<a class="more" href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer">Lees verder</a>';
      }

      function render() {
        var top = articles.slice(0, 8);
        var tickerGroup = '<span class="ticker-group"><span class="ticker-label">Laatste nieuws</span>' +
          top.map(tickerItem).join('') + '</span>';

        var cards = articles.map(function (a) {
          var color = esc(a.color || '#121212');
          return '' +
            '<div class="card">' +
              '<div class="kicker" style="color:' + color + '">' + esc(a.source) + '</div>' +
              '<a href="' + esc(a.link) + '" target="_blank" rel="noopener noreferrer"><h4>' + esc(a.title) + '</h4></a>' +
              (a.summary ? '<p class="summary">' + esc(a.summary) + '</p>' : '') +
              '<span class="time">' + esc(formatTime(a.pubDate)) + '</span>' +
            '</div>';
        }).join('');

        root.innerHTML = '' +
          '<header class="masthead">' +
            '<div class="dateline"><span>' + esc(longDate()) + '</span><span>Nederlandse editie</span></div>' +
            '<div class="nameplate"><h1>Nederlandse Nieuwsticker</h1><div class="tag">Het laatste nieuws, feitelijk gebracht</div></div>' +
          '</header>' +
          '<div class="ticker"><div class="ticker-track">' + tickerGroup + tickerGroup + '</div></div>' +
          '<div class="container">' +
            '<div class="lead" id="featured">' + leadHTML(articles[0]) + '</div>' +
            '<div class="section-head">Meer berichten</div>' +
            '<div class="grid">' + cards + '</div>' +
            '<div style="text-align:center;margin:28px 0 8px;font-family:var(--sans);font-size:13px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
              '<a href="/geheugen/" style="display:inline-block;border:1px solid var(--ink);padding:8px 16px;border-radius:999px">📰 Onthoud wat je leest → Nieuwsgeheugen</a>' +
              '<a href="/uitjes/" style="display:inline-block;border:1px solid var(--ink);padding:8px 16px;border-radius:999px">🚉 Wat is er te doen → Zuid-Holland Vandaag</a>' +
              '<a href="/vakantieplekken/" style="display:inline-block;border:1px solid var(--ink);padding:8px 16px;border-radius:999px">🧳 Blijf op de hoogte → Vakantieplekken</a>' +
            '</div>' +
          '</div>';
      }

      // isRefresh=true: stille achtergrond-verversing — geen laadscherm en
      // alleen opnieuw renderen als het nieuws echt veranderd is, zodat de
      // pagina niet verspringt tijdens het lezen.
      function load(isRefresh) {
        if (!isRefresh) showLoading();
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 12000);
        fetch('/api/news', { signal: controller.signal })
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            if (!Array.isArray(data)) throw new Error('Onverwacht antwoord');
            if (data.length === 0) {
              if (!isRefresh) showError('Geen nieuws beschikbaar op dit moment');
              return;
            }
            var sig = data.map(function (a) { return a.link; }).join('|');
            if (sig === lastSig) return; // niets veranderd → niet opnieuw renderen
            articles = data;
            lastSig = sig;
            render();
          })
          .catch(function (err) {
            if (!isRefresh) showError(err && err.name === 'AbortError' ? 'Het laden duurde te lang' : 'Fout bij laden nieuws');
          })
          .then(function () { clearTimeout(timer); });
      }

      // Ververs stil elke 5 minuten (alleen opnieuw renderen bij nieuw nieuws)
      setInterval(function () {
        if (document.getElementById('featured')) load(true);
      }, 300000);

      load(false);
    })();
  </script>
</body>
</html>
