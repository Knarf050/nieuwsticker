<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woo Quest — volg je Woo-verzoeken</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/woo-data.js"></script>
  <style>
    body { font-family: 'Nunito', system-ui, -apple-system, sans-serif; }
    .node-pop { animation: pop .3s ease; }
    @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
    .pulse-ring { animation: pulsering 1.8s ease-out infinite; }
    @keyframes pulsering { 0% { box-shadow: 0 0 0 0 rgba(88,204,2,.5);} 70% { box-shadow: 0 0 0 14px rgba(88,204,2,0);} 100% { box-shadow: 0 0 0 0 rgba(88,204,2,0);} }
    .confetti { animation: rise 1s ease forwards; }
    @keyframes rise { 0% { transform: translateY(0) scale(1); opacity:1;} 100% { transform: translateY(-40px) scale(1.4); opacity:0;} }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 6px; }
  </style>
</head>
<body class="bg-[#f7f7f7]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const CONFIG = window.WOO_CONFIG;
    const TEMPLATE = window.WOO_TEMPLATE;
    const SEED = window.WOO_SEED;
    const STORE_KEY = 'wooQuest.v1';
    const DAY = 86400000;

    const FASES = ['Intake & termijnen', 'Inventarisatie & beoordeling', 'Besluitvorming', 'Afronding'];
    const FASE_KLEUR = {
      'Intake & termijnen':            { bg: '#1cb0f6', soft: '#e1f4ff' },
      'Inventarisatie & beoordeling':  { bg: '#ce82ff', soft: '#f5e9ff' },
      'Besluitvorming':                { bg: '#ff9600', soft: '#fff1de' },
      'Afronding':                     { bg: '#58cc02', soft: '#e8f9d6' },
    };

    // ---------- helpers ----------
    const todayStr = () => new Date().toISOString().slice(0, 10);
    const parseDate = (s) => s ? new Date(s + 'T00:00:00') : null;
    const fmtDate = (s) => s ? parseDate(s).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
    const addDays = (d, n) => new Date(d.getTime() + n * DAY);
    const daysBetween = (a, b) => Math.round((a.getTime() - b.getTime()) / DAY);

    function deadlineInfo(v) {
      const start = parseDate(v.datumOntvangst);
      if (!start) return null;
      const t = CONFIG.termijnen;
      let dagen = t.beslistermijnDagen + (v.verdaging ? t.verdagingDagen : 0) + (Number(v.opschortingDagen) || 0);
      const deadline = addDays(start, dagen);
      const resterend = daysBetween(deadline, parseDate(todayStr()));
      return { deadline, resterend, dagen };
    }

    function actieveStappen(v) {
      // optionele stappen die op n.v.t. staan tellen niet mee
      const nvt = new Set(v.nvt || []);
      return TEMPLATE.filter(s => !nvt.has(s.id));
    }

    function voortgang(v) {
      const stappen = actieveStappen(v);
      const klaar = new Set(v.klaar || []);
      const done = stappen.filter(s => klaar.has(s.id)).length;
      const xp = stappen.filter(s => klaar.has(s.id)).reduce((a, s) => a + s.xp, 0);
      const volgende = stappen.find(s => !klaar.has(s.id)) || null;
      return { done, totaal: stappen.length, pct: Math.round(done / stappen.length * 100), xp, volgende, afgerond: done === stappen.length };
    }

    function statusKleur(v) {
      const vg = voortgang(v);
      if (vg.afgerond) return { label: 'Afgerond', kleur: '#58cc02', soft: '#e8f9d6' };
      const dl = deadlineInfo(v);
      if (!dl) return { label: 'Geen datum', kleur: '#afafaf', soft: '#eee' };
      if (dl.resterend < 0) return { label: `${Math.abs(dl.resterend)} dgn te laat`, kleur: '#ff4b4b', soft: '#ffe3e3' };
      if (dl.resterend <= 7) return { label: `Nog ${dl.resterend} dgn`, kleur: '#ff9600', soft: '#fff1de' };
      return { label: `Nog ${dl.resterend} dgn`, kleur: '#58cc02', soft: '#e8f9d6' };
    }

    // ---------- badges ----------
    const BADGES = [
      { id: 'eerste', icon: '🥉', titel: 'Eerste stap', uitleg: 'Eerste stap voltooid', test: (g) => g.totaalKlaar >= 1 },
      { id: 'tien', icon: '🥈', titel: 'Op dreef', uitleg: '10 stappen voltooid', test: (g) => g.totaalKlaar >= 10 },
      { id: 'lakmeester', icon: '🖌️', titel: 'Lakmeester', uitleg: 'Lakwerk gecontroleerd in een zaak', test: (g) => g.verzoeken.some(v => (v.klaar||[]).includes('lakcontrole')) },
      { id: 'handtekening', icon: '✍️', titel: 'Getekend', uitleg: 'Manager heeft getekend', test: (g) => g.verzoeken.some(v => (v.klaar||[]).includes('handtekening')) },
      { id: 'optijd', icon: '⚡', titel: 'Op tijd', uitleg: 'Een verzoek vóór de deadline afgerond', test: (g) => g.verzoeken.some(v => { const vg=voortgang(v); const dl=deadlineInfo(v); return vg.afgerond && dl && dl.resterend >= 0; }) },
      { id: 'afgerond', icon: '🏆', titel: 'Dossier dicht', uitleg: 'Een verzoek volledig afgerond', test: (g) => g.verzoeken.some(v => voortgang(v).afgerond) },
      { id: 'streak3', icon: '🔥', titel: 'Streak 3', uitleg: '3 dagen op rij actief', test: (g) => g.streak >= 3 },
    ];

    // ---------- storage ----------
    function laadState() {
      let opgeslagen = null;
      try { opgeslagen = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
      const seedMap = Object.fromEntries(SEED.map(v => [v.id, v]));
      let verzoeken;
      if (opgeslagen && opgeslagen.verzoeken) {
        // bewaar bestaande + voeg nieuwe seed-verzoeken toe
        const map = Object.fromEntries(opgeslagen.verzoeken.map(v => [v.id, v]));
        for (const v of SEED) if (!map[v.id]) map[v.id] = v;
        verzoeken = Object.values(map);
      } else {
        verzoeken = SEED.map(v => ({ ...v }));
      }
      const game = (opgeslagen && opgeslagen.game) || { streak: 0, lastActive: null, badges: [] };
      return { verzoeken, game };
    }

    function bewaarState(state) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    // ---------- UI bouwstenen ----------
    function StatChip({ icon, waarde, label, kleur }) {
      return (
        <div className="flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-white shadow-sm">
          <span className="text-xl" style={{ color: kleur }}>{icon}</span>
          <div className="leading-tight">
            <div className="font-extrabold text-gray-800 text-sm">{waarde}</div>
            <div className="text-[10px] uppercase tracking-wide text-gray-400 font-bold">{label}</div>
          </div>
        </div>
      );
    }

    function ProgressBar({ pct, kleur }) {
      return (
        <div className="w-full h-3 rounded-full bg-gray-200 overflow-hidden">
          <div className="h-full rounded-full transition-all duration-500" style={{ width: pct + '%', background: kleur }} />
        </div>
      );
    }

    // ---------- het Duolingo-pad ----------
    function PadNode({ stap, status, deadlineLabel, onClick }) {
      const fk = FASE_KLEUR[stap.fase];
      let bg = '#e5e5e5', ring = '#cfcfcf', tekstKleur = '#9ca3af', schaduw = '#bdbdbd';
      if (status === 'done') { bg = fk.bg; ring = fk.bg; tekstKleur = '#fff'; schaduw = 'rgba(0,0,0,.18)'; }
      if (status === 'next') { bg = '#fff'; ring = fk.bg; tekstKleur = fk.bg; }
      return (
        <button onClick={onClick}
          className={"relative flex flex-col items-center group focus:outline-none " + (status === 'next' ? 'pulse-ring rounded-full' : '')}
          title={stap.uitleg}>
          <div className={"w-16 h-16 rounded-full flex items-center justify-center text-2xl border-4 transition " + (status !== 'nvt' ? 'node-pop' : '')}
            style={{ background: bg, borderColor: ring, color: tekstKleur, boxShadow: status === 'done' ? `0 5px 0 ${schaduw}` : 'none', opacity: status === 'nvt' ? .45 : 1 }}>
            {status === 'done' ? '✓' : stap.icon}
          </div>
          <div className="mt-2 text-center max-w-[150px]">
            <div className="text-xs font-extrabold text-gray-700 leading-tight">{stap.label}</div>
            {stap.deadline && deadlineLabel && (
              <div className="text-[11px] font-bold mt-0.5" style={{ color: deadlineLabel.kleur }}>⏱️ {deadlineLabel.tekst}</div>
            )}
            {stap.optioneel && <div className="text-[10px] text-gray-400 font-bold">optioneel</div>}
          </div>
        </button>
      );
    }

    function Pad({ v, onToggle, onNvt }) {
      const klaar = new Set(v.klaar || []);
      const nvt = new Set(v.nvt || []);
      const vg = voortgang(v);
      const dl = deadlineInfo(v);
      let deadlineLabel = null;
      if (dl) {
        const sk = statusKleur(v);
        deadlineLabel = { kleur: sk.kleur, tekst: vg.afgerond ? 'beslist' : (dl.resterend < 0 ? `${Math.abs(dl.resterend)} dgn te laat` : `nog ${dl.resterend} dgn`) };
      }
      return (
        <div className="space-y-8">
          {FASES.map((fase) => {
            const stappenInFase = TEMPLATE.filter(s => s.fase === fase);
            const fk = FASE_KLEUR[fase];
            return (
              <div key={fase}>
                <div className="flex items-center gap-2 mb-4">
                  <span className="px-3 py-1 rounded-full text-white text-xs font-extrabold uppercase tracking-wide" style={{ background: fk.bg }}>{fase}</span>
                  <div className="flex-1 h-px" style={{ background: fk.soft }} />
                </div>
                <div className="flex flex-wrap gap-x-6 gap-y-7 justify-center sm:justify-start">
                  {stappenInFase.map((stap) => {
                    let status = 'todo';
                    if (nvt.has(stap.id)) status = 'nvt';
                    else if (klaar.has(stap.id)) status = 'done';
                    else if (vg.volgende && vg.volgende.id === stap.id) status = 'next';
                    return (
                      <div key={stap.id} className="flex flex-col items-center">
                        <PadNode stap={stap} status={status} deadlineLabel={deadlineLabel}
                          onClick={() => onToggle(stap.id)} />
                        {stap.optioneel && (
                          <button onClick={() => onNvt(stap.id)}
                            className="mt-1 text-[10px] font-bold text-gray-400 hover:text-gray-600 underline">
                            {nvt.has(stap.id) ? 'wél van toepassing' : 'n.v.t.'}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ---------- detail-weergave ----------
    function Detail({ v, onClose, onToggle, onNvt, onUpdate }) {
      const vg = voortgang(v);
      const sk = statusKleur(v);
      const dl = deadlineInfo(v);
      return (
        <div className="fixed inset-0 z-40 bg-black/40 flex items-start sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
          <div className="bg-white w-full sm:max-w-4xl sm:rounded-3xl shadow-2xl min-h-screen sm:min-h-0">
            <div className="sticky top-0 bg-white z-10 px-5 sm:px-8 pt-5 pb-4 border-b border-gray-100 sm:rounded-t-3xl">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <div className="text-xs font-bold text-gray-400">{v.kenmerk} · {v.bestuursorgaan}</div>
                  <h2 className="text-xl sm:text-2xl font-extrabold text-gray-800 leading-tight">{v.titel}</h2>
                  <div className="text-sm text-gray-500">Verzoeker: {v.verzoeker || '—'}</div>
                </div>
                <button onClick={onClose} className="shrink-0 w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold text-lg">✕</button>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
                <div className="bg-gray-50 rounded-2xl p-3">
                  <div className="text-[10px] uppercase font-bold text-gray-400">Ontvangen</div>
                  <input type="date" value={v.datumOntvangst || ''} onChange={(e) => onUpdate({ datumOntvangst: e.target.value })}
                    className="w-full bg-transparent font-bold text-gray-700 text-sm outline-none" />
                </div>
                <div className="bg-gray-50 rounded-2xl p-3">
                  <div className="text-[10px] uppercase font-bold text-gray-400">Wettelijke deadline</div>
                  <div className="font-bold text-sm" style={{ color: sk.kleur }}>{dl ? fmtDate(dl.deadline.toISOString().slice(0,10)) : '—'}</div>
                </div>
                <label className="bg-gray-50 rounded-2xl p-3 flex flex-col cursor-pointer">
                  <div className="text-[10px] uppercase font-bold text-gray-400">Verdaging (+2 wk)</div>
                  <div className="flex items-center gap-2 mt-1">
                    <input type="checkbox" checked={!!v.verdaging} onChange={(e) => onUpdate({ verdaging: e.target.checked })} className="w-4 h-4 accent-orange-500" />
                    <span className="font-bold text-gray-700 text-sm">{v.verdaging ? 'Ja' : 'Nee'}</span>
                  </div>
                </label>
                <div className="bg-gray-50 rounded-2xl p-3">
                  <div className="text-[10px] uppercase font-bold text-gray-400">Opschorting (dagen)</div>
                  <input type="number" min="0" value={v.opschortingDagen || 0} onChange={(e) => onUpdate({ opschortingDagen: Math.max(0, parseInt(e.target.value || '0')) })}
                    className="w-full bg-transparent font-bold text-gray-700 text-sm outline-none" />
                </div>
              </div>

              <div className="mt-4 flex items-center gap-3">
                <span className="font-extrabold text-gray-700 text-sm whitespace-nowrap">{vg.done}/{vg.totaal} · {vg.pct}%</span>
                <ProgressBar pct={vg.pct} kleur={sk.kleur} />
                <span className="text-xs font-bold whitespace-nowrap" style={{ color: sk.kleur }}>{vg.xp} XP</span>
              </div>
              {vg.volgende && (
                <div className="mt-2 text-sm"><span className="text-gray-400 font-bold">Volgende:</span> <span className="font-bold text-gray-700">{vg.volgende.icon} {vg.volgende.label}</span></div>
              )}
            </div>

            <div className="px-5 sm:px-8 py-6">
              <Pad v={v} onToggle={onToggle} onNvt={onNvt} />
            </div>
          </div>
        </div>
      );
    }

    // ---------- verzoek-kaart ----------
    function VerzoekKaart({ v, onOpen }) {
      const vg = voortgang(v);
      const sk = statusKleur(v);
      return (
        <button onClick={onOpen}
          className="text-left bg-white rounded-3xl p-5 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition border-2 border-transparent hover:border-gray-100 w-full">
          <div className="flex items-start justify-between gap-3">
            <div>
              <div className="text-[11px] font-bold text-gray-400">{v.kenmerk} · {v.bestuursorgaan}</div>
              <h3 className="font-extrabold text-gray-800 leading-tight">{v.titel}</h3>
            </div>
            <span className="shrink-0 px-2.5 py-1 rounded-full text-xs font-extrabold" style={{ background: sk.soft, color: sk.kleur }}>{sk.label}</span>
          </div>
          <div className="mt-4 flex items-center gap-3">
            <span className="font-extrabold text-gray-600 text-xs whitespace-nowrap">{vg.pct}%</span>
            <ProgressBar pct={vg.pct} kleur={sk.kleur} />
          </div>
          <div className="mt-3 text-xs text-gray-500">
            {vg.afgerond
              ? <span className="font-bold text-green-600">🏆 Afgerond — {vg.xp} XP</span>
              : <span><span className="text-gray-400">Nu:</span> <span className="font-bold text-gray-700">{vg.volgende ? vg.volgende.icon + ' ' + vg.volgende.label : '—'}</span></span>}
          </div>
        </button>
      );
    }

    // ---------- wettelijk kader ----------
    function Kader() {
      const [open, setOpen] = useState(false);
      const Section = ({ titel, items }) => (
        <div>
          <div className="font-extrabold text-gray-700 text-sm mb-1">{titel}</div>
          <ul className="space-y-1">
            {items.map((i, idx) => (
              <li key={idx} className="text-sm text-gray-600 flex gap-2">
                <span className="font-mono text-[11px] text-gray-400 shrink-0 mt-0.5 w-24">{i.grond}</span>
                <span>{i.tekst}</span>
              </li>
            ))}
          </ul>
        </div>
      );
      return (
        <div className="bg-white rounded-3xl shadow-sm overflow-hidden">
          <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between px-5 py-4">
            <span className="font-extrabold text-gray-800">📚 Wettelijk kader — Wet open overheid</span>
            <span className="text-gray-400 font-bold">{open ? '▲' : '▼'}</span>
          </button>
          {open && (
            <div className="px-5 pb-6 space-y-5">
              <Section titel="Termijnen" items={CONFIG.termijnUitleg.map(t => ({ grond: t.grond, tekst: t.titel + ' — ' + t.tekst }))} />
              <Section titel="Absolute uitzonderingsgronden (art. 5.1 lid 1)" items={CONFIG.absoluteGronden} />
              <Section titel="Relatieve uitzonderingsgronden (art. 5.1 lid 2)" items={CONFIG.relatieveGronden} />
              <Section titel="Intern beraad & belangenafweging" items={CONFIG.bijzondereGronden} />
            </div>
          )}
        </div>
      );
    }

    // ---------- hoofd-app ----------
    function App() {
      const [state, setState] = useState(laadState);
      const [openId, setOpenId] = useState(null);
      const [sort, setSort] = useState('deadline');

      useEffect(() => { bewaarState(state); }, [state]);

      const setVerzoek = (id, patch) => {
        setState(s => ({ ...s, verzoeken: s.verzoeken.map(v => v.id === id ? { ...v, ...patch } : v) }));
      };

      const registreerActiviteit = (s) => {
        const t = todayStr();
        const g = s.game;
        if (g.lastActive === t) return g;
        let streak = 1;
        if (g.lastActive) {
          const diff = daysBetween(parseDate(t), parseDate(g.lastActive));
          if (diff === 1) streak = (g.streak || 0) + 1;
          else if (diff === 0) streak = g.streak || 1;
        }
        return { ...g, streak, lastActive: t };
      };

      const toggleStap = (id, stapId) => {
        setState(s => {
          const verzoeken = s.verzoeken.map(v => {
            if (v.id !== id) return v;
            const klaar = new Set(v.klaar || []);
            klaar.has(stapId) ? klaar.delete(stapId) : klaar.add(stapId);
            const nvt = new Set(v.nvt || []); nvt.delete(stapId);
            return { ...v, klaar: [...klaar], nvt: [...nvt] };
          });
          return { ...s, verzoeken, game: registreerActiviteit(s) };
        });
      };

      const toggleNvt = (id, stapId) => {
        setState(s => ({ ...s, verzoeken: s.verzoeken.map(v => {
          if (v.id !== id) return v;
          const nvt = new Set(v.nvt || []);
          const klaar = new Set(v.klaar || []);
          if (nvt.has(stapId)) nvt.delete(stapId);
          else { nvt.add(stapId); klaar.delete(stapId); }
          return { ...v, nvt: [...nvt], klaar: [...klaar] };
        }) }));
      };

      // afgeleide game-stats
      const stats = useMemo(() => {
        const totaalXp = state.verzoeken.reduce((a, v) => a + voortgang(v).xp, 0);
        const totaalKlaar = state.verzoeken.reduce((a, v) => a + (v.klaar || []).filter(id => !(v.nvt||[]).includes(id)).length, 0);
        const level = Math.floor(totaalXp / 100) + 1;
        const naarVolgend = 100 - (totaalXp % 100);
        const afgerond = state.verzoeken.filter(v => voortgang(v).afgerond).length;
        const teLaat = state.verzoeken.filter(v => { const dl = deadlineInfo(v); return dl && dl.resterend < 0 && !voortgang(v).afgerond; }).length;
        const gctx = { ...state.game, verzoeken: state.verzoeken, totaalKlaar };
        const badges = BADGES.filter(b => b.test(gctx));
        return { totaalXp, totaalKlaar, level, naarVolgend, afgerond, teLaat, badges };
      }, [state]);

      const gesorteerd = useMemo(() => {
        const arr = [...state.verzoeken];
        if (sort === 'deadline') {
          arr.sort((a, b) => {
            const av = voortgang(a).afgerond ? 1 : 0, bv = voortgang(b).afgerond ? 1 : 0;
            if (av !== bv) return av - bv;
            const ad = deadlineInfo(a), bd = deadlineInfo(b);
            return (ad ? ad.resterend : 9e9) - (bd ? bd.resterend : 9e9);
          });
        } else if (sort === 'voortgang') {
          arr.sort((a, b) => voortgang(b).pct - voortgang(a).pct);
        }
        return arr;
      }, [state.verzoeken, sort]);

      const openVerzoek = state.verzoeken.find(v => v.id === openId);

      return (
        <div className="min-h-screen pb-16">
          {/* topbar */}
          <header className="sticky top-0 z-30 bg-[#58cc02] text-white shadow-md">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-2xl">🦉</span>
                <div>
                  <div className="font-extrabold text-lg leading-none">Woo Quest</div>
                  <div className="text-[11px] text-green-100 font-bold">Volg je Woo-verzoeken</div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <div className="flex items-center gap-1 bg-white/15 rounded-2xl px-2.5 py-1.5"><span>🔥</span><span className="font-extrabold text-sm">{state.game.streak || 0}</span></div>
                <div className="flex items-center gap-1 bg-white/15 rounded-2xl px-2.5 py-1.5"><span>⭐</span><span className="font-extrabold text-sm">{stats.totaalXp}</span></div>
                <div className="hidden sm:flex items-center gap-1 bg-white/15 rounded-2xl px-2.5 py-1.5"><span>🎖️</span><span className="font-extrabold text-sm">Lv {stats.level}</span></div>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 mt-5 space-y-6">
            {/* level voortgang */}
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <div className="flex items-center justify-between mb-2">
                <span className="font-extrabold text-gray-800">🎖️ Niveau {stats.level}</span>
                <span className="text-xs font-bold text-gray-400">nog {stats.naarVolgend} XP tot niveau {stats.level + 1}</span>
              </div>
              <ProgressBar pct={100 - stats.naarVolgend} kleur="#ffc800" />
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
                <StatChip icon="📂" waarde={state.verzoeken.length} label="Verzoeken" kleur="#1cb0f6" />
                <StatChip icon="✅" waarde={stats.afgerond} label="Afgerond" kleur="#58cc02" />
                <StatChip icon="⏱️" waarde={stats.totaalKlaar} label="Stappen" kleur="#ce82ff" />
                <StatChip icon="⚠️" waarde={stats.teLaat} label="Te laat" kleur={stats.teLaat ? '#ff4b4b' : '#afafaf'} />
              </div>
            </div>

            {/* badges */}
            <div className="bg-white rounded-3xl p-5 shadow-sm">
              <div className="font-extrabold text-gray-800 mb-3">🏅 Badges</div>
              <div className="flex flex-wrap gap-3">
                {BADGES.map(b => {
                  const verdiend = stats.badges.some(x => x.id === b.id);
                  return (
                    <div key={b.id} title={b.uitleg}
                      className="flex flex-col items-center w-20 text-center"
                      style={{ opacity: verdiend ? 1 : .35, filter: verdiend ? 'none' : 'grayscale(1)' }}>
                      <div className="text-3xl">{b.icon}</div>
                      <div className="text-[10px] font-bold text-gray-600 leading-tight mt-0.5">{b.titel}</div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* lijst */}
            <div>
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-extrabold text-gray-800 text-lg">📋 Mijn Woo-verzoeken</h2>
                <div className="flex items-center gap-1 text-xs font-bold">
                  <span className="text-gray-400">Sorteer:</span>
                  <button onClick={() => setSort('deadline')} className={"px-2.5 py-1 rounded-full " + (sort==='deadline' ? 'bg-[#58cc02] text-white' : 'bg-white text-gray-500')}>Deadline</button>
                  <button onClick={() => setSort('voortgang')} className={"px-2.5 py-1 rounded-full " + (sort==='voortgang' ? 'bg-[#58cc02] text-white' : 'bg-white text-gray-500')}>Voortgang</button>
                </div>
              </div>
              <div className="grid sm:grid-cols-2 gap-4">
                {gesorteerd.map(v => <VerzoekKaart key={v.id} v={v} onOpen={() => setOpenId(v.id)} />)}
              </div>
            </div>

            <Kader />

            <div className="text-center text-xs text-gray-400 pt-2">
              Je voortgang wordt lokaal in deze browser bewaard. Verzoeken aanpassen? Bewerk <code className="bg-gray-100 px-1 rounded">public/woo-data.js</code>. ·
              <a href="/nieuws.html" className="text-blue-400 hover:underline ml-1">Nieuwsticker →</a>
            </div>
          </main>

          {openVerzoek && (
            <Detail v={openVerzoek} onClose={() => setOpenId(null)}
              onToggle={(stapId) => toggleStap(openVerzoek.id, stapId)}
              onNvt={(stapId) => toggleNvt(openVerzoek.id, stapId)}
              onUpdate={(patch) => setVerzoek(openVerzoek.id, patch)} />
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
