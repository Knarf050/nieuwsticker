<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nieuwsgeheugen — onthoud wat je leest</title>
  <link rel="manifest" href="/geheugen/manifest.webmanifest">
  <meta name="theme-color" content="#1cb0f6">
  <link rel="icon" href="/geheugen/icon-192.png">
  <link rel="apple-touch-icon" href="/geheugen/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nieuwsgeheugen">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/geheugen/geheugen-data.js"></script>
  <style>
    body { font-family: 'Nunito', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .pop { animation: pop .3s ease; }
    @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .flip { animation: flip .35s ease; }
    @keyframes flip { from { transform: rotateX(90deg); opacity: 0; } to { transform: rotateX(0); opacity: 1; } }
    .toast-in { animation: toastin .3s ease; }
    @keyframes toastin { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .pieces span { position: absolute; font-size: 22px; animation: fall 1.2s ease-out forwards; }
    @keyframes fall { 0% { transform: translateY(-10px) rotate(0); opacity: 1; } 100% { transform: translateY(160px) rotate(360deg); opacity: 0; } }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 6px; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="bg-[#f7f7f7]">
  <div id="root"></div>

  <button id="installBtn" style="display:none"
    class="fixed bottom-24 left-5 z-40 bg-white text-[#1cb0f6] font-extrabold text-sm px-4 py-3 rounded-2xl shadow-lg border-2 border-[#1cb0f6]">
    ⬇️ Installeer app
  </button>

  <script>
    // Installeren als echte app (Android/desktop Chrome/Edge)
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block';
    });
    installBtn.addEventListener('click', async () => {
      installBtn.style.display = 'none';
      if (!deferredPrompt) return;
      deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null;
    });
    window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/geheugen/sw.js').catch(() => {}));
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const CONFIG = window.GEHEUGEN_CONFIG;
    const STORE_KEY = 'nieuwsgeheugen.v1';
    const DAY = 86400000;
    const ACCENT = '#1cb0f6';

    // ---------- datum-helpers ----------
    const todayStr = () => new Date().toISOString().slice(0, 10);
    const parseDate = (s) => new Date(s + 'T00:00:00');
    const addDaysStr = (s, n) => new Date(parseDate(s).getTime() + n * DAY).toISOString().slice(0, 10);
    const daysBetween = (a, b) => Math.round((parseDate(a).getTime() - parseDate(b).getTime()) / DAY);
    const fmtKort = (s) => s ? parseDate(s).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) : '';
    const fmtLang = (s) => s ? parseDate(s).toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'long' }) : '';
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const round2 = (x) => Math.round(x * 100) / 100;

    const themaById = (themas, id) => themas.find(t => t.id === id) || { naam: 'Overig', kleur: '#9aa0a6' };

    // ---------- spaced repetition (eigen SM-2-variant, geen externe app) ----------
    // 4 knoppen vertalen naar een interval in dagen. 'Weer' laat de kaart binnen
    // dezelfde sessie terugkomen; de rest plant 'm vooruit op basis van 'ease'.
    function nieuweSrs() {
      return { ease: 2.5, interval: 0, reps: 0, due: todayStr(), lapses: 0, last: null };
    }
    function plan(srs, grade) {
      let { ease, interval, reps, lapses } = srs;
      if (grade === 'weer') {
        ease = Math.max(1.3, ease - 0.2); reps = 0; interval = 0; lapses += 1;
      } else if (grade === 'lastig') {
        ease = Math.max(1.3, ease - 0.15);
        interval = reps === 0 ? 1 : Math.max(1, Math.round(interval * 1.2)); reps += 1;
      } else if (grade === 'goed') {
        if (reps === 0) interval = 1; else if (reps === 1) interval = 3;
        else interval = Math.round(interval * ease); reps += 1;
      } else { // makkelijk
        ease += 0.15;
        if (reps === 0) interval = 2; else if (reps === 1) interval = 5;
        else interval = Math.round(interval * ease * 1.3); reps += 1;
      }
      interval = Math.min(interval, 365);
      const due = grade === 'weer' ? todayStr() : addDaysStr(todayStr(), interval);
      return { ease: round2(ease), interval, reps, due, lapses, last: todayStr() };
    }
    const isDue = (c) => c.srs.due <= todayStr();

    // ---------- gamification ----------
    const XP = { kaart: 10, weer: 2, lastig: 4, goed: 6, makkelijk: 8, synthese: 5, quizGoed: 2, quizBonus: 10 };
    const niveauVan = (xp) => Math.floor(xp / 100) + 1;
    const xpInNiveau = (xp) => xp % 100;

    function markActief(game) {
      const t = todayStr();
      if (game.lastActive === t) return game;
      const gisteren = addDaysStr(t, -1);
      const streak = game.lastActive === gisteren ? (game.streak || 0) + 1 : 1;
      return { ...game, streak, lastActive: t };
    }
    function resetDagteller(game) {
      if (!game.reviews || game.reviews.date !== todayStr()) {
        return { ...game, reviews: { date: todayStr(), count: 0 } };
      }
      return game;
    }

    const BADGES = [
      { id: 'k1',   icon: '🃏', titel: 'Eerste kaart',  uitleg: 'Je eerste kaartje gemaakt',     test: (s) => s.kaarten >= 1 },
      { id: 'k10',  icon: '📚', titel: 'Verzamelaar',   uitleg: '10 kaartjes gemaakt',           test: (s) => s.kaarten >= 10 },
      { id: 'k50',  icon: '🗂️', titel: 'Archivaris',    uitleg: '50 kaartjes gemaakt',           test: (s) => s.kaarten >= 50 },
      { id: 'r1',   icon: '🔁', titel: 'Eerste herhaling', uitleg: 'Een kaart herhaald',         test: (s) => s.herhalingen >= 1 },
      { id: 'r100', icon: '🧠', titel: 'Geheugentraining', uitleg: '100 herhalingen gedaan',     test: (s) => s.herhalingen >= 100 },
      { id: 's3',   icon: '🔥', titel: 'Streak 3',       uitleg: '3 dagen op rij actief',         test: (s) => s.streak >= 3 },
      { id: 's7',   icon: '🌟', titel: 'Week-streak',    uitleg: '7 dagen op rij actief',         test: (s) => s.streak >= 7 },
      { id: 's30',  icon: '👑', titel: 'Maand-streak',   uitleg: '30 dagen op rij actief',        test: (s) => s.streak >= 30 },
      { id: 'thema',icon: '🧵', titel: 'Verhaallijn',    uitleg: '10 kaarten in één thema',       test: (s) => s.maxThema >= 10 },
      { id: 'syn7', icon: '✍️', titel: 'Dagboekschrijver', uitleg: '7 dagen een synthese',        test: (s) => s.syntheseDagen >= 7 },
      { id: 'quiz', icon: '🏆', titel: 'Quizmeester',    uitleg: 'Een weekquiz foutloos',         test: (s) => s.quizPerfect },
    ];

    // ---------- opslag ----------
    function laadState() {
      let opg = null;
      try { opg = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
      if (opg && opg.cards) {
        return {
          cards: opg.cards, notes: opg.notes || [], journal: opg.journal || {},
          themas: opg.themas || CONFIG.themas,
          game: opg.game || { xp: 0, streak: 0, lastActive: null, dagDoel: 10, reviews: { date: todayStr(), count: 0 }, herhalingenTotaal: 0, quizPerfect: false },
          seedGeladen: true,
        };
      }
      // Eerste keer: voorbeeldkaarten laden zodat de app meteen iets toont.
      const cards = (CONFIG.seedKaarten || []).map(s => ({
        id: uid(), vraag: s.vraag, antwoord: s.antwoord, thema: s.thema, bron: s.bron || '',
        tags: [], aangemaakt: todayStr(), srs: nieuweSrs(),
      }));
      return {
        cards, notes: [], journal: {}, themas: CONFIG.themas,
        game: { xp: 0, streak: 0, lastActive: null, dagDoel: 10, reviews: { date: todayStr(), count: 0 }, herhalingenTotaal: 0, quizPerfect: false },
        seedGeladen: true,
      };
    }
    function bewaarState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }

    // ---------- kleine UI-bouwstenen ----------
    function Ring({ pct, kleur, groot }) {
      const r = groot ? 34 : 16, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, pct) / 100);
      const size = (r + 6) * 2;
      return (
        <svg width={size} height={size} className="-rotate-90">
          <circle cx={size/2} cy={size/2} r={r} stroke="#e5e7eb" strokeWidth="6" fill="none" />
          <circle cx={size/2} cy={size/2} r={r} stroke={kleur} strokeWidth="6" fill="none"
            strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{ transition: 'stroke-dashoffset .5s ease' }} />
        </svg>
      );
    }
    function Confetti() {
      const emojis = ['🎉','✨','🟦','⭐','🟩','🎊','💪'];
      return (
        <div className="pieces fixed inset-0 z-[60] pointer-events-none">
          {Array.from({ length: 26 }).map((_, i) => (
            <span key={i} style={{ left: Math.random()*100+'%', top: '-5%', animationDelay: (Math.random()*.4)+'s' }}>
              {emojis[i % emojis.length]}
            </span>
          ))}
        </div>
      );
    }

    // ---------- hoofd-app ----------
    function App() {
      const [state, setState] = useState(laadState);
      const [tab, setTab] = useState('vandaag');
      const [toast, setToast] = useState(null);
      const [confetti, setConfetti] = useState(false);
      const toastTimer = useRef(null);

      useEffect(() => { bewaarState(state); }, [state]);

      function melding(tekst) {
        setToast(tekst);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 2200);
      }
      function vier() { setConfetti(true); setTimeout(() => setConfetti(false), 1300); }

      // Centrale update-helper: kopieert state, past 'm aan, bewaart.
      function update(fn) {
        setState(prev => {
          const next = fn(structuredClone(prev));
          return next;
        });
      }

      // --- acties ---
      function voegKaartToe({ vraag, antwoord, thema, bron, tags }) {
        update(s => {
          s.cards.push({ id: uid(), vraag, antwoord, thema, bron, tags, aangemaakt: todayStr(), srs: nieuweSrs() });
          s.game = markActief(resetDagteller(s.game));
          s.game.xp += XP.kaart;
          return s;
        });
        melding('Kaart toegevoegd · +' + XP.kaart + ' XP 🃏');
      }
      function verwijderKaart(id) {
        update(s => { s.cards = s.cards.filter(c => c.id !== id); return s; });
      }
      function beoordeelKaart(id, grade) {
        update(s => {
          const c = s.cards.find(x => x.id === id);
          if (!c) return s;
          c.srs = plan(c.srs, grade);
          s.game = markActief(resetDagteller(s.game));
          s.game.xp += XP[grade];
          s.game.reviews.count += 1;
          s.game.herhalingenTotaal = (s.game.herhalingenTotaal || 0) + 1;
          return s;
        });
      }
      function voegNotitieToe(thema, tekst) {
        update(s => {
          s.notes.push({ id: uid(), thema, tekst, datum: todayStr() });
          s.game = markActief(s.game);
          return s;
        });
        melding('Notitie opgeslagen 🧵');
      }
      function verwijderNotitie(id) {
        update(s => { s.notes = s.notes.filter(n => n.id !== id); return s; });
      }
      function bewaarSynthese(tekst) {
        update(s => {
          const bestond = !!(s.journal[todayStr()] && s.journal[todayStr()].trim());
          s.journal[todayStr()] = tekst;
          s.game = markActief(s.game);
          if (!bestond && tekst.trim()) s.game.xp += XP.synthese;
          return s;
        });
        melding('Synthese van vandaag bewaard ✍️');
      }
      function voegThemaToe(naam, kleur) {
        update(s => {
          const id = naam.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || uid();
          if (!s.themas.some(t => t.id === id)) s.themas.push({ id, naam, kleur });
          return s;
        });
      }
      function quizKlaar(score, totaal) {
        update(s => {
          s.game = markActief(resetDagteller(s.game));
          s.game.xp += score * XP.quizGoed + (totaal > 0 ? XP.quizBonus : 0);
          if (totaal > 0 && score === totaal) s.game.quizPerfect = true;
          return s;
        });
      }
      function importeer(data) {
        if (!data || !Array.isArray(data.cards)) { melding('Ongeldig back-upbestand'); return; }
        update(() => ({
          cards: data.cards, notes: data.notes || [], journal: data.journal || {},
          themas: data.themas || CONFIG.themas, game: data.game || laadState().game, seedGeladen: true,
        }));
        melding('Back-up hersteld ✅');
      }
      function resetAlles() {
        localStorage.removeItem(STORE_KEY);
        setState(laadState());
        melding('Opnieuw begonnen');
      }

      const dueKaarten = useMemo(() => state.cards.filter(isDue), [state.cards]);
      const game = resetDagteller(state.game);

      return (
        <div className="max-w-xl mx-auto min-h-screen pb-24 bg-[#f7f7f7]">
          <TopBar game={game} />

          <div className="px-4">
            {tab === 'vandaag' && (
              <VandaagView state={state} game={game} due={dueKaarten}
                onStart={() => setTab('leren')} onQuiz={() => setTab('quiz')}
                onSynthese={bewaarSynthese} />
            )}
            {tab === 'leren' && (
              <LeerView due={dueKaarten} onBeoordeel={beoordeelKaart} dagDoel={game.dagDoel}
                gedaanVandaag={game.reviews.count} onKlaar={vier} themas={state.themas}
                onNaarNieuw={() => setTab('nieuw')} />
            )}
            {tab === 'nieuw' && (
              <NieuwView themas={state.themas} onToevoegen={voegKaartToe} onThemaToe={voegThemaToe} />
            )}
            {tab === 'themas' && (
              <ThemaView state={state} onNotitie={voegNotitieToe} onVerwijderNotitie={verwijderNotitie}
                onVerwijderKaart={verwijderKaart} onThemaToe={voegThemaToe} />
            )}
            {tab === 'ik' && (
              <ProfielView state={state} game={game} onDagDoel={(n) => update(s => { s.game.dagDoel = n; return s; })}
                onImport={importeer} onReset={resetAlles} />
            )}
          </div>

          {tab === 'quiz' && (
            <QuizView cards={state.cards} themas={state.themas} onSluiten={() => setTab('vandaag')}
              onKlaar={(score, totaal) => { quizKlaar(score, totaal); if (totaal && score === totaal) vier(); }} />
          )}

          <NavBalk tab={tab} setTab={setTab} due={dueKaarten.length} />

          {toast && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 bg-[#1f2937] text-white text-sm font-bold px-5 py-3 rounded-2xl shadow-xl toast-in">
              {toast}
            </div>
          )}
          {confetti && <Confetti />}
        </div>
      );
    }

    // ---------- bovenbalk ----------
    function TopBar({ game }) {
      return (
        <div className="sticky top-0 z-30 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
          <div className="font-extrabold text-lg" style={{ color: ACCENT }}>📰 Nieuwsgeheugen</div>
          <div className="flex items-center gap-3 text-sm font-extrabold">
            <span title="Streak" className="flex items-center gap-1 text-orange-500">🔥 {game.streak || 0}</span>
            <span title="Niveau" className="flex items-center gap-1 text-[#1cb0f6]">⭐ {niveauVan(game.xp)}</span>
            <span title="XP" className="text-gray-500">{game.xp} XP</span>
          </div>
        </div>
      );
    }

    // ---------- Vandaag ----------
    function VandaagView({ state, game, due, onStart, onQuiz, onSynthese }) {
      const [tekst, setTekst] = useState(state.journal[todayStr()] || '');
      const pct = game.dagDoel ? (game.reviews.count / game.dagDoel) * 100 : 0;
      const klaarMetDoel = game.reviews.count >= game.dagDoel;
      const uur = new Date().getHours();
      const groet = uur < 6 ? 'Goedenacht' : uur < 12 ? 'Goedemorgen' : uur < 18 ? 'Goedemiddag' : 'Goedenavond';

      return (
        <div className="py-4 space-y-4">
          <div className="text-gray-500 text-sm font-bold">{groet} · {fmtLang(todayStr())}</div>

          {/* Dagdoel */}
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex items-center gap-4">
            <div className="relative shrink-0">
              <Ring pct={pct} kleur={klaarMetDoel ? '#58cc02' : ACCENT} groot />
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-xl font-extrabold">{game.reviews.count}</span>
                <span className="text-[10px] text-gray-400 -mt-1">/ {game.dagDoel}</span>
              </div>
            </div>
            <div className="flex-1">
              <div className="font-extrabold text-lg">{klaarMetDoel ? 'Dagdoel gehaald! 🎉' : 'Dagdoel'}</div>
              <div className="text-sm text-gray-500 mb-2">
                {due.length > 0 ? `${due.length} kaart${due.length === 1 ? '' : 'jes'} te herhalen` : 'Niets meer te herhalen vandaag'}
              </div>
              <button onClick={onStart} disabled={due.length === 0}
                className="w-full rounded-2xl py-2.5 font-extrabold text-white shadow disabled:opacity-40 active:translate-y-px"
                style={{ background: ACCENT }}>
                {due.length > 0 ? 'Start herhalen' : 'Klaar voor vandaag'}
              </button>
            </div>
          </div>

          {/* Synthese van de dag */}
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <div className="font-extrabold mb-1">✍️ Synthese van vandaag</div>
            <div className="text-xs text-gray-500 mb-2">In 3 zinnen: wat is het belangrijkste dat je vandaag las, en waarom?</div>
            <textarea value={tekst} onChange={e => setTekst(e.target.value)} rows={3}
              placeholder="1. …&#10;2. …&#10;3. …"
              className="w-full border border-gray-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#1cb0f6]/40" />
            <button onClick={() => onSynthese(tekst)}
              className="mt-2 rounded-2xl px-4 py-2 font-extrabold text-white text-sm active:translate-y-px" style={{ background: '#58cc02' }}>
              Bewaren
            </button>
          </div>

          {/* Snelacties */}
          <div className="grid grid-cols-2 gap-3">
            <button onClick={onQuiz} className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 text-left active:translate-y-px">
              <div className="text-2xl">🏆</div>
              <div className="font-extrabold mt-1">Weekquiz</div>
              <div className="text-xs text-gray-500">Test jezelf met 10 vragen</div>
            </button>
            <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
              <div className="text-2xl">📈</div>
              <div className="font-extrabold mt-1">{state.cards.length} kaarten</div>
              <div className="text-xs text-gray-500">{Object.keys(state.journal).length} dagen synthese</div>
            </div>
          </div>
        </div>
      );
    }

    // ---------- Leren (herhaalsessie) ----------
    function LeerView({ due, onBeoordeel, dagDoel, gedaanVandaag, onKlaar, themas, onNaarNieuw }) {
      const [queue, setQueue] = useState(() => due.map(c => c.id));
      const [snapshot] = useState(() => Object.fromEntries(due.map(c => [c.id, c])));
      const [toon, setToon] = useState(false);
      const [klaar, setKlaar] = useState(due.length === 0);
      const startAantal = useRef(due.length);

      // Als er nieuwe due-kaarten bijkomen terwijl je hier staat (zelden), niet herstarten.
      const huidigeId = queue[0];
      const kaart = huidigeId ? snapshot[huidigeId] : null;

      function beoordeel(grade) {
        onBeoordeel(huidigeId, grade);
        setToon(false);
        setQueue(q => {
          const rest = q.slice(1);
          const nieuw = grade === 'weer' ? [...rest, huidigeId] : rest;
          if (nieuw.length === 0) { setKlaar(true); onKlaar && onKlaar(); }
          return nieuw;
        });
      }

      if (klaar || !kaart) {
        return (
          <div className="py-16 text-center space-y-4">
            <div className="text-6xl">{startAantal.current > 0 ? '🎉' : '☕'}</div>
            <div className="font-extrabold text-xl">{startAantal.current > 0 ? 'Sessie klaar!' : 'Niets te herhalen'}</div>
            <div className="text-gray-500 text-sm">
              {startAantal.current > 0
                ? `Je herhaalde ${startAantal.current} kaart${startAantal.current === 1 ? '' : 'jes'}. Kom morgen terug — dan plant het algoritme de volgende.`
                : 'Voeg kaartjes toe terwijl je de krant leest, dan verschijnen ze hier op het juiste moment.'}
            </div>
            <button onClick={onNaarNieuw} className="rounded-2xl px-5 py-3 font-extrabold text-white" style={{ background: ACCENT }}>
              ➕ Nieuw kaartje
            </button>
          </div>
        );
      }

      const t = themaById(themas, kaart.thema);
      const over = queue.length;
      return (
        <div className="py-4">
          <div className="flex items-center justify-between mb-3 text-xs font-bold text-gray-400">
            <span>Nog {over} in deze sessie</span>
            <span>{gedaanVandaag}/{dagDoel} dagdoel</span>
          </div>
          <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 min-h-[260px] flex flex-col">
            <span className="self-start text-xs font-extrabold px-2.5 py-1 rounded-full mb-4"
              style={{ background: t.kleur + '22', color: t.kleur }}>{t.naam}</span>
            <div className="flex-1 flex items-center justify-center text-center">
              <div className="text-xl font-extrabold leading-snug">{kaart.vraag}</div>
            </div>
            {toon && (
              <div className="flip border-t border-gray-100 pt-4 mt-4 text-center text-gray-700">
                {kaart.antwoord}
                {kaart.bron && <div className="text-xs text-gray-400 mt-2">Bron: {kaart.bron}</div>}
              </div>
            )}
          </div>

          {!toon ? (
            <button onClick={() => setToon(true)}
              className="mt-4 w-full rounded-2xl py-4 font-extrabold text-white text-lg active:translate-y-px" style={{ background: ACCENT }}>
              Toon antwoord
            </button>
          ) : (
            <div className="mt-4 grid grid-cols-4 gap-2">
              <GradeKnop label="Weer" sub="<10 min" kleur="#ff4b4b" onClick={() => beoordeel('weer')} />
              <GradeKnop label="Lastig" sub={voorbeeldInterval(kaart.srs, 'lastig')} kleur="#ff9600" onClick={() => beoordeel('lastig')} />
              <GradeKnop label="Goed" sub={voorbeeldInterval(kaart.srs, 'goed')} kleur="#1cb0f6" onClick={() => beoordeel('goed')} />
              <GradeKnop label="Makkelijk" sub={voorbeeldInterval(kaart.srs, 'makkelijk')} kleur="#58cc02" onClick={() => beoordeel('makkelijk')} />
            </div>
          )}
        </div>
      );
    }
    function voorbeeldInterval(srs, grade) {
      const p = plan(srs, grade);
      if (grade === 'weer') return 'nu';
      return p.interval === 1 ? '1 dag' : p.interval + ' dgn';
    }
    function GradeKnop({ label, sub, kleur, onClick }) {
      return (
        <button onClick={onClick} className="rounded-2xl py-2.5 text-white font-extrabold text-sm active:translate-y-px flex flex-col items-center" style={{ background: kleur }}>
          <span>{label}</span>
          <span className="text-[10px] font-bold opacity-80">{sub}</span>
        </button>
      );
    }

    // ---------- Nieuw kaartje ----------
    function NieuwView({ themas, onToevoegen, onThemaToe }) {
      const [vraag, setVraag] = useState('');
      const [antwoord, setAntwoord] = useState('');
      const [thema, setThema] = useState(themas[0]?.id || 'overig');
      const [bron, setBron] = useState('NRC ' + fmtKort(todayStr()));
      const [tags, setTags] = useState('');
      const [nieuwThema, setNieuwThema] = useState(false);
      const [themaNaam, setThemaNaam] = useState('');

      function opslaan() {
        if (!vraag.trim() || !antwoord.trim()) return;
        onToevoegen({
          vraag: vraag.trim(), antwoord: antwoord.trim(), thema, bron: bron.trim(),
          tags: tags.split(',').map(t => t.trim()).filter(Boolean),
        });
        setVraag(''); setAntwoord(''); setTags('');
      }

      return (
        <div className="py-4 space-y-4">
          <div className="font-extrabold text-xl">➕ Nieuw kaartje</div>
          <div className="text-xs text-gray-500 -mt-2">Maak 3–5 kaartjes per editie. Eén goed onthouden feit is meer waard dan tien half vergeten.</div>

          <Veld label="Vraag / voorkant">
            <textarea value={vraag} onChange={e => setVraag(e.target.value)} rows={2}
              placeholder="Bijv. Welk besluit nam het kabinet over de stikstofaanpak?"
              className="w-full border border-gray-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#1cb0f6]/40" />
          </Veld>
          <Veld label="Antwoord / achterkant">
            <textarea value={antwoord} onChange={e => setAntwoord(e.target.value)} rows={3}
              placeholder="In je eigen woorden — dat onthoud je beter dan een citaat."
              className="w-full border border-gray-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#1cb0f6]/40" />
          </Veld>

          <Veld label="Thema">
            {!nieuwThema ? (
              <div className="flex gap-2">
                <select value={thema} onChange={e => setThema(e.target.value)}
                  className="flex-1 border border-gray-200 rounded-2xl p-3 text-sm bg-white">
                  {themas.map(t => <option key={t.id} value={t.id}>{t.naam}</option>)}
                </select>
                <button onClick={() => setNieuwThema(true)} className="px-4 rounded-2xl border border-gray-200 font-bold text-gray-600">+ nieuw</button>
              </div>
            ) : (
              <div className="flex gap-2">
                <input value={themaNaam} onChange={e => setThemaNaam(e.target.value)} placeholder="Naam nieuw thema"
                  className="flex-1 border border-gray-200 rounded-2xl p-3 text-sm" />
                <button onClick={() => {
                  if (!themaNaam.trim()) return;
                  const kleur = '#' + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
                  onThemaToe(themaNaam.trim(), kleur);
                  const id = themaNaam.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
                  setThema(id); setNieuwThema(false); setThemaNaam('');
                }} className="px-4 rounded-2xl text-white font-bold" style={{ background: '#58cc02' }}>ok</button>
              </div>
            )}
          </Veld>

          <div className="grid grid-cols-2 gap-3">
            <Veld label="Bron"><input value={bron} onChange={e => setBron(e.target.value)} className="w-full border border-gray-200 rounded-2xl p-3 text-sm" /></Veld>
            <Veld label="Tags (komma)"><input value={tags} onChange={e => setTags(e.target.value)} placeholder="stikstof, kabinet" className="w-full border border-gray-200 rounded-2xl p-3 text-sm" /></Veld>
          </div>

          <button onClick={opslaan} disabled={!vraag.trim() || !antwoord.trim()}
            className="w-full rounded-2xl py-4 font-extrabold text-white text-lg disabled:opacity-40 active:translate-y-px" style={{ background: ACCENT }}>
            Kaartje opslaan · +{XP.kaart} XP
          </button>
        </div>
      );
    }
    function Veld({ label, children }) {
      return <div><div className="text-xs font-extrabold text-gray-500 mb-1 uppercase tracking-wide">{label}</div>{children}</div>;
    }

    // ---------- Thema's & tijdlijn ----------
    function ThemaView({ state, onNotitie, onVerwijderNotitie, onVerwijderKaart, onThemaToe }) {
      const [open, setOpen] = useState(null);
      const tellingen = useMemo(() => {
        const m = {};
        for (const c of state.cards) m[c.thema] = (m[c.thema] || 0) + 1;
        for (const n of state.notes) m[n.thema] = (m[n.thema] || 0);
        return m;
      }, [state.cards, state.notes]);

      if (open) {
        return <ThemaDetail thema={open} state={state} onTerug={() => setOpen(null)}
          onNotitie={onNotitie} onVerwijderNotitie={onVerwijderNotitie} onVerwijderKaart={onVerwijderKaart} />;
      }

      return (
        <div className="py-4 space-y-3">
          <div className="font-extrabold text-xl">🧵 Thema's</div>
          <div className="text-xs text-gray-500 -mt-1">Volg verhaallijnen over weken. Klik een thema voor de tijdlijn.</div>
          {state.themas.map(t => {
            const aantalK = state.cards.filter(c => c.thema === t.id).length;
            const aantalN = state.notes.filter(n => n.thema === t.id).length;
            return (
              <button key={t.id} onClick={() => setOpen(t)}
                className="w-full bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center gap-3 text-left active:translate-y-px">
                <div className="w-3 h-10 rounded-full" style={{ background: t.kleur }} />
                <div className="flex-1">
                  <div className="font-extrabold">{t.naam}</div>
                  <div className="text-xs text-gray-500">{aantalK} kaart{aantalK === 1 ? '' : 'en'} · {aantalN} notitie{aantalN === 1 ? '' : 's'}</div>
                </div>
                <span className="text-gray-300 text-xl">›</span>
              </button>
            );
          })}
        </div>
      );
    }
    function ThemaDetail({ thema, state, onTerug, onNotitie, onVerwijderNotitie, onVerwijderKaart }) {
      const [notitie, setNotitie] = useState('');
      // Tijdlijn = kaarten + notities samen, nieuw bovenaan.
      const items = useMemo(() => {
        const k = state.cards.filter(c => c.thema === thema.id).map(c => ({ type: 'kaart', datum: c.aangemaakt, data: c }));
        const n = state.notes.filter(x => x.thema === thema.id).map(x => ({ type: 'notitie', datum: x.datum, data: x }));
        return [...k, ...n].sort((a, b) => (b.datum + b.data.id).localeCompare(a.datum + a.data.id));
      }, [state.cards, state.notes, thema.id]);

      return (
        <div className="py-4 space-y-4">
          <button onClick={onTerug} className="text-sm font-bold text-gray-500">‹ Terug</button>
          <div className="flex items-center gap-2">
            <div className="w-3 h-8 rounded-full" style={{ background: thema.kleur }} />
            <div className="font-extrabold text-xl">{thema.naam}</div>
          </div>

          <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div className="text-xs font-extrabold text-gray-500 mb-1 uppercase">Notitie toevoegen aan deze verhaallijn</div>
            <textarea value={notitie} onChange={e => setNotitie(e.target.value)} rows={2}
              placeholder="Bijv. nieuwe ontwikkeling in dit dossier…"
              className="w-full border border-gray-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#1cb0f6]/40" />
            <button onClick={() => { if (notitie.trim()) { onNotitie(thema.id, notitie.trim()); setNotitie(''); } }}
              className="mt-2 rounded-2xl px-4 py-2 font-extrabold text-white text-sm" style={{ background: thema.kleur }}>Opslaan</button>
          </div>

          <div className="space-y-3">
            {items.length === 0 && <div className="text-center text-gray-400 text-sm py-8">Nog niets in deze verhaallijn.</div>}
            {items.map(it => (
              <div key={it.data.id} className="relative pl-5">
                <div className="absolute left-0 top-2 w-2.5 h-2.5 rounded-full" style={{ background: thema.kleur }} />
                <div className="absolute left-[4px] top-4 bottom-0 w-px bg-gray-200" />
                <div className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
                  <div className="flex justify-between items-start gap-2">
                    <div className="text-[11px] font-bold text-gray-400">{fmtKort(it.datum)} · {it.type === 'kaart' ? '🃏 kaart' : '🧵 notitie'}</div>
                    <button onClick={() => it.type === 'kaart' ? onVerwijderKaart(it.data.id) : onVerwijderNotitie(it.data.id)}
                      className="text-gray-300 text-xs">✕</button>
                  </div>
                  {it.type === 'kaart' ? (
                    <div className="mt-1"><div className="font-bold text-sm">{it.data.vraag}</div><div className="text-sm text-gray-600 mt-0.5">{it.data.antwoord}</div></div>
                  ) : (
                    <div className="mt-1 text-sm text-gray-700">{it.data.tekst}</div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- Weekquiz ----------
    function QuizView({ cards, themas, onSluiten, onKlaar }) {
      // Kies tot 10 kaarten; meerkeuze met afleiders uit andere antwoorden.
      const vragen = useMemo(() => {
        const pool = [...cards].sort(() => Math.random() - 0.5).slice(0, 10);
        return pool.map(c => {
          const afleiders = cards.filter(x => x.id !== c.id).map(x => x.antwoord);
          const opties = [c.antwoord, ...afleiders.sort(() => Math.random() - 0.5).slice(0, 3)].sort(() => Math.random() - 0.5);
          return { kaart: c, opties, juist: c.antwoord };
        });
      }, []);
      const [i, setI] = useState(0);
      const [score, setScore] = useState(0);
      const [gekozen, setGekozen] = useState(null);
      const [klaar, setKlaar] = useState(false);
      const gerapporteerd = useRef(false);

      if (cards.length < 4) {
        return <Overlay onSluiten={onSluiten} titel="Weekquiz">
          <div className="text-center text-gray-500 py-8">Maak eerst minstens 4 kaartjes, dan kun je quizzen. 🃏</div>
        </Overlay>;
      }

      if (klaar) {
        if (!gerapporteerd.current) { gerapporteerd.current = true; onKlaar(score, vragen.length); }
        const perfect = score === vragen.length;
        return <Overlay onSluiten={onSluiten} titel="Weekquiz">
          <div className="text-center py-6 space-y-3">
            <div className="text-6xl">{perfect ? '🏆' : score >= vragen.length / 2 ? '👏' : '💪'}</div>
            <div className="font-extrabold text-2xl">{score} / {vragen.length} goed</div>
            <div className="text-gray-500 text-sm">{perfect ? 'Foutloos! Badge verdiend.' : 'Mooi — de fouten komen vanzelf terug in je herhalingen.'}</div>
            <button onClick={onSluiten} className="rounded-2xl px-6 py-3 font-extrabold text-white" style={{ background: ACCENT }}>Klaar</button>
          </div>
        </Overlay>;
      }

      const v = vragen[i];
      const t = themaById(themas, v.kaart.thema);
      function kies(optie) {
        if (gekozen) return;
        setGekozen(optie);
        if (optie === v.juist) setScore(s => s + 1);
        setTimeout(() => {
          if (i + 1 >= vragen.length) setKlaar(true);
          else { setI(i + 1); setGekozen(null); }
        }, 900);
      }

      return (
        <Overlay onSluiten={onSluiten} titel={`Vraag ${i + 1}/${vragen.length}`}>
          <div className="space-y-4">
            <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div className="h-full rounded-full transition-all" style={{ width: ((i) / vragen.length * 100) + '%', background: ACCENT }} />
            </div>
            <span className="inline-block text-xs font-extrabold px-2.5 py-1 rounded-full" style={{ background: t.kleur + '22', color: t.kleur }}>{t.naam}</span>
            <div className="font-extrabold text-lg">{v.kaart.vraag}</div>
            <div className="space-y-2">
              {v.opties.map((o, idx) => {
                let cls = 'bg-white border-gray-200';
                if (gekozen) {
                  if (o === v.juist) cls = 'bg-[#e8f9d6] border-[#58cc02]';
                  else if (o === gekozen) cls = 'bg-[#ffe3e3] border-[#ff4b4b]';
                }
                return (
                  <button key={idx} onClick={() => kies(o)} disabled={!!gekozen}
                    className={'w-full text-left border-2 rounded-2xl p-3 text-sm font-medium active:translate-y-px ' + cls}>
                    {o}
                  </button>
                );
              })}
            </div>
          </div>
        </Overlay>
      );
    }
    function Overlay({ titel, onSluiten, children }) {
      return (
        <div className="fixed inset-0 z-50 bg-white max-w-xl mx-auto flex flex-col">
          <div className="flex items-center justify-between px-4 py-3 border-b border-gray-100">
            <div className="font-extrabold">{titel}</div>
            <button onClick={onSluiten} className="text-gray-400 text-xl">✕</button>
          </div>
          <div className="flex-1 overflow-y-auto p-4">{children}</div>
        </div>
      );
    }

    // ---------- Profiel / Ik ----------
    function ProfielView({ state, game, onDagDoel, onImport, onReset }) {
      const stats = useMemo(() => {
        const perThema = {};
        for (const c of state.cards) perThema[c.thema] = (perThema[c.thema] || 0) + 1;
        return {
          kaarten: state.cards.length,
          herhalingen: game.herhalingenTotaal || 0,
          streak: game.streak || 0,
          syntheseDagen: Object.values(state.journal).filter(v => v && v.trim()).length,
          maxThema: Math.max(0, ...Object.values(perThema)),
          quizPerfect: !!game.quizPerfect,
        };
      }, [state, game]);
      const fileRef = useRef(null);

      function exporteer() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'nieuwsgeheugen-backup-' + todayStr() + '.json';
        a.click(); URL.revokeObjectURL(url);
      }
      function kiesBestand(e) {
        const f = e.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => { try { onImport(JSON.parse(r.result)); } catch { onImport(null); } };
        r.readAsText(f);
      }

      return (
        <div className="py-4 space-y-4">
          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex items-center gap-4">
            <div className="relative shrink-0">
              <Ring pct={xpInNiveau(game.xp)} kleur={ACCENT} groot />
              <div className="absolute inset-0 flex items-center justify-center text-2xl font-extrabold">{niveauVan(game.xp)}</div>
            </div>
            <div>
              <div className="font-extrabold text-lg">Niveau {niveauVan(game.xp)}</div>
              <div className="text-sm text-gray-500">{game.xp} XP · nog {100 - xpInNiveau(game.xp)} tot volgend niveau</div>
              <div className="text-sm text-orange-500 font-bold mt-1">🔥 {game.streak || 0} dagen streak</div>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-3 text-center">
            <Stat icon="🃏" waarde={stats.kaarten} label="kaarten" />
            <Stat icon="🔁" waarde={stats.herhalingen} label="herhalingen" />
            <Stat icon="✍️" waarde={stats.syntheseDagen} label="syntheses" />
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <div className="font-extrabold mb-3">🏅 Badges</div>
            <div className="grid grid-cols-4 gap-3">
              {BADGES.map(b => {
                const behaald = b.test(stats);
                return (
                  <div key={b.id} title={b.uitleg} className={'flex flex-col items-center text-center ' + (behaald ? '' : 'opacity-30 grayscale')}>
                    <div className="text-3xl">{b.icon}</div>
                    <div className="text-[10px] font-bold mt-1 leading-tight">{b.titel}</div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
            <div className="font-extrabold mb-2">⚙️ Dagdoel</div>
            <div className="flex items-center gap-2">
              {[5, 10, 15, 20].map(n => (
                <button key={n} onClick={() => onDagDoel(n)}
                  className={'flex-1 rounded-2xl py-2 font-extrabold border-2 ' + (game.dagDoel === n ? 'text-white' : 'text-gray-600 border-gray-200')}
                  style={game.dagDoel === n ? { background: ACCENT, borderColor: ACCENT } : {}}>{n}</button>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-2">
            <div className="font-extrabold mb-1">💾 Jouw data (blijft van jou)</div>
            <div className="text-xs text-gray-500 mb-2">Alles staat lokaal in deze browser. Maak een back-up of zet 'm op een ander apparaat.</div>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={exporteer} className="rounded-2xl py-2.5 font-extrabold border-2 border-gray-200 text-gray-700">⬇️ Exporteren</button>
              <button onClick={() => fileRef.current.click()} className="rounded-2xl py-2.5 font-extrabold border-2 border-gray-200 text-gray-700">⬆️ Importeren</button>
              <input ref={fileRef} type="file" accept="application/json" className="hidden" onChange={kiesBestand} />
            </div>
            <button onClick={() => { if (confirm('Alles wissen en opnieuw beginnen?')) onReset(); }}
              className="w-full rounded-2xl py-2.5 font-extrabold text-[#ff4b4b] border-2 border-[#ffd5d5] mt-1">Opnieuw beginnen</button>
          </div>

          <div className="text-center text-xs text-gray-400 pt-2">
            <a href="/" className="underline">← Nieuwsticker</a> · <a href="/woo/" className="underline">Woo Quest</a>
          </div>
        </div>
      );
    }
    function Stat({ icon, waarde, label }) {
      return (
        <div className="bg-white rounded-2xl p-3 shadow-sm border border-gray-100">
          <div className="text-xl">{icon}</div>
          <div className="font-extrabold text-lg">{waarde}</div>
          <div className="text-[11px] text-gray-400">{label}</div>
        </div>
      );
    }

    // ---------- onderbalk ----------
    function NavBalk({ tab, setTab, due }) {
      const items = [
        { id: 'vandaag', icon: '🏠', label: 'Vandaag' },
        { id: 'leren', icon: '🎴', label: 'Leren', badge: due },
        { id: 'nieuw', icon: '➕', label: 'Nieuw' },
        { id: 'themas', icon: '🧵', label: "Thema's" },
        { id: 'ik', icon: '🏅', label: 'Ik' },
      ];
      return (
        <div className="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-gray-200 safe-bottom">
          <div className="max-w-xl mx-auto grid grid-cols-5">
            {items.map(it => (
              <button key={it.id} onClick={() => setTab(it.id)}
                className={'relative py-2.5 flex flex-col items-center text-[11px] font-bold ' + (tab === it.id ? 'text-[#1cb0f6]' : 'text-gray-400')}>
                <span className="text-xl">{it.icon}</span>
                {it.label}
                {it.badge > 0 && (
                  <span className="absolute top-1.5 right-1/2 translate-x-4 bg-[#ff4b4b] text-white text-[9px] font-extrabold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">{it.badge}</span>
                )}
              </button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
